name: Portfolio checks (publishing disabled)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --check dist/app.js && node --check dist/engine.js
      - run: node check.cjs
      - run: node scripts/security-check.cjs
      - run: node scripts/workflow-check.cjs
      - run: node scripts/shai-check.cjs
